name: Dispatch candidate refresh after merge

on:
  pull_request_target:
    types: [closed]

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Dispatch trusted main-branch refresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update-jobs.yml --repo "$GITHUB_REPOSITORY" --ref main
