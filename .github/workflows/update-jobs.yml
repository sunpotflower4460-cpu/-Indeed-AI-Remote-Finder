name: Update job candidates
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */8 * * *'
  push:
    branches: ["main"]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/update-jobs.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run quality tests
        run: python -m unittest discover -s tests -q
      - name: Preserve previous feed for short carryover guard
        run: cp data/jobs.json /tmp/previous-jobs.json
      - name: Refresh candidates
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python scripts/fetch_jobs.py
      - name: Deduplicate and guard against one flaky refresh
        run: python scripts/postprocess_feed.py --previous /tmp/previous-jobs.json
      - name: Validate generated feed
        run: python scripts/validate_feed.py
      - name: Commit refreshed feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh validated job candidates"
          git push
