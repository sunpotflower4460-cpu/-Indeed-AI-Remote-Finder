name: Update job candidates
on:
  workflow_dispatch:
  schedule:
    - cron: '25 23 * * *'
  push:
    branches: ["main"]
    paths:
      - 'scripts/**'
      - '.github/workflows/update-jobs.yml'
permissions:
  contents: write
concurrency:
  group: update-job-candidates
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Report optional provider configuration
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$SERPAPI_KEY" ]; then echo "SerpApi: configured"; else echo "SerpApi: not configured"; fi
          if [ -n "$OPENAI_API_KEY" ]; then echo "OpenAI: configured"; else echo "OpenAI: not configured"; fi
      - name: Run quality tests
        run: python -m unittest discover -s tests -q
      - name: Preserve previous feed for carryover and LLM cache
        run: cp data/jobs.json /tmp/previous-jobs.json
      - name: Refresh diverse autonomous-work candidates
        id: acquisition
        continue-on-error: true
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python scripts/acquisition_supply_yield.py
      - name: Stamp safe provider guard diagnostics
        if: always()
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python scripts/stamp_provider_health.py
      - name: Stamp safe acquisition outcome
        if: always()
        env:
          ACQUISITION_OUTCOME: ${{ steps.acquisition.outcome }}
        run: python scripts/stamp_refresh_outcome.py
      - name: Deduplicate and maintain rolling candidate pool
        if: always()
        run: python scripts/postprocess_feed.py --previous /tmp/previous-jobs.json
      - name: Optional LLM second-opinion audit
        id: llm_audit
        continue-on-error: true
        # At most eight paid attempts are permitted across both LLM audit steps.
        timeout-minutes: 10
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-luna
        run: |
          set +e
          python scripts/llm_review.py --previous /tmp/previous-jobs.json --max-new-reviews 8 --max-paid-attempts-per-month 700 2>/tmp/llm-review.err
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "LLM audit returned non-zero status $status; detailed provider error is intentionally hidden."
          fi
          exit "$status"
      - name: Recover reusable LLM cache after interrupted audit
        if: always() && steps.llm_audit.outcome != 'success'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-luna
        run: |
          cp data/jobs.json /tmp/llm-failed-state.json
          python scripts/llm_review.py --previous /tmp/previous-jobs.json --max-new-reviews 0 --max-paid-attempts-per-month 700 >/tmp/llm-cache-recovery.out 2>/tmp/llm-cache-recovery.err || true
          python - <<'PY'
          import json
          from pathlib import Path

          current_path = Path("data/jobs.json")
          failed_path = Path("/tmp/llm-failed-state.json")
          current = json.loads(current_path.read_text(encoding="utf-8"))
          failed = json.loads(failed_path.read_text(encoding="utf-8"))
          completed_write = "llm_paid_attempts_month" in failed
          if completed_write:
              for key in (
                  "llm_new_reviews",
                  "llm_reused_reviews",
                  "llm_review_failures",
                  "llm_fatal_error",
                  "llm_errors",
                  "llm_paid_attempts_month",
              ):
                  if key in failed:
                      current[key] = failed[key]
          else:
              cap = int(current.get("llm_max_paid_attempts_per_month") or 700)
              attempts = int(current.get("llm_paid_attempts_month") or 0)
              current["llm_paid_attempts_month"] = min(cap, attempts + 8)
              current["llm_attempts_uncertain"] = True
              current["llm_monthly_budget_exhausted"] = bool(
                  current.get("llm_provider_configured") is True
                  and current["llm_paid_attempts_month"] >= cap
              )
          current_path.write_text(
              json.dumps(current, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          PY
      - name: Use spare LLM run budget on review candidates
        id: llm_review_tier
        continue-on-error: true
        timeout-minutes: 10
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-luna
        run: |
          set +e
          python scripts/llm_review_quality.py --previous /tmp/previous-jobs.json --run-attempt-cap 8 --max-paid-attempts-per-month 700 2>/tmp/llm-review-tier.err
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "Review-tier LLM audit returned non-zero status $status; detailed provider error is intentionally hidden."
          fi
          exit "$status"
      - name: Redact public LLM diagnostics
        if: always()
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          path = Path("data/jobs.json")
          data = json.loads(path.read_text(encoding="utf-8"))

          def classify(value):
              text = str(value or "")
              match = re.search(r"OpenAI HTTP (\d{3})", text)
              status = int(match.group(1)) if match else None
              error_type = None
              error_code = None
              if match:
                  tail = text[match.end():].lstrip(": ")
                  try:
                      payload = json.loads(tail)
                      err = payload.get("error") or {}
                      error_type = str(err.get("type") or "") or None
                      error_code = str(err.get("code") or "") or None
                  except Exception:
                      pass
              return status, error_type, error_code

          raw_errors = list(data.get("llm_errors") or [])
          status, error_type, error_code = classify(data.get("llm_fatal_error"))
          if status is None:
              for item in raw_errors:
                  item_status, item_type, item_code = classify(item)
                  if item_status is not None:
                      status, error_type, error_code = item_status, item_type, item_code
                      break

          data["llm_error_status"] = status
          data["llm_error_type"] = error_type
          data["llm_error_code"] = error_code
          data["llm_fatal_error"] = None

          safe_errors = []
          for item in raw_errors:
              item_status, _, _ = classify(item)
              job_match = re.match(r"^([^:]+):", str(item))
              job_id = job_match.group(1) if job_match else "job"
              safe_errors.append(
                  f"{job_id}: OpenAI HTTP {item_status}" if item_status else f"{job_id}: LLM audit error"
              )
          data["llm_errors"] = safe_errors[:8]

          path.write_text(json.dumps(data, ensure_ascii=False, indent=2), encoding="utf-8")
          if data.get("llm_review_failures"):
              print(
                  "LLM diagnostics redacted: "
                  f"failures={data.get('llm_review_failures')} "
                  f"status={data.get('llm_error_status')} "
                  f"type={data.get('llm_error_type')} code={data.get('llm_error_code')}"
              )
          PY
      - name: Apply LLM quality vetoes
        run: python scripts/apply_llm_quality_gate.py
      - name: Validate generated feed
        run: |
          python scripts/validate_feed.py
          python scripts/validate_remote_feed.py
      - name: Commit refreshed feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Do not rebase a feed generated by older code onto a newer main.
          # A relevant merge dispatches a fresh trusted run, so skipping is safer
          # than publishing data produced under a superseded policy revision.
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "main moved during refresh; skipping stale generated-feed commit."
            exit 0
          fi
          git add data/jobs.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh validated job candidates"
          git push origin HEAD:main
