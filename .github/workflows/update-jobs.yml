name: Update job candidates
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */8 * * *'
  push:
    branches: ["main"]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/update-jobs.yml'
permissions:
  contents: write
concurrency:
  group: update-job-candidates
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Report optional provider configuration
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$SERPAPI_KEY" ]; then echo "SerpApi: configured"; else echo "SerpApi: not configured"; fi
          if [ -n "$OPENAI_API_KEY" ]; then echo "OpenAI: configured"; else echo "OpenAI: not configured"; fi
      - name: Run quality tests
        run: python -m unittest discover -s tests -q
      - name: Preserve previous feed for carryover and LLM cache
        run: cp data/jobs.json /tmp/previous-jobs.json
      - name: Refresh candidates
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python scripts/fetch_jobs.py
      - name: Deduplicate and guard against one flaky refresh
        run: python scripts/postprocess_feed.py --previous /tmp/previous-jobs.json
      - name: Optional LLM second-opinion audit
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-luna
        run: python scripts/llm_review.py --previous /tmp/previous-jobs.json --max-new-reviews 8
      - name: Validate generated feed
        run: python scripts/validate_feed.py
      - name: Commit refreshed feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh validated job candidates"
          git pull --rebase origin main
          git push
