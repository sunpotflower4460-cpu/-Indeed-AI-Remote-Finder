name: Fast Indeed feed refresh
run-name: Fast Indeed feed refresh
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - '.github/workflows/fast-indeed-refresh.yml'
      - 'scripts/indeed_index_core.py'
      - 'scripts/supplement_indeed_web_index.py'
      - 'scripts/supplement_indeed_web_index_v2.py'
      - 'scripts/harden_indeed_index_matches.py'
      - 'scripts/validate_indeed_discovery_runtime.py'
  pull_request:
    branches: ["main"]
    paths:
      - '.github/workflows/fast-indeed-refresh.yml'
      - 'scripts/indeed_index_core.py'
      - 'scripts/supplement_indeed_web_index.py'
      - 'scripts/supplement_indeed_web_index_v2.py'
      - 'scripts/harden_indeed_index_matches.py'
      - 'scripts/validate_indeed_discovery_runtime.py'
permissions:
  contents: write
concurrency:
  group: fast-indeed-refresh-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run core feed tests
        run: python -m unittest discover -s tests -q
      - name: Preserve previous feed
        run: cp data/jobs.json /tmp/previous-jobs.json
      - name: Refresh structured candidates with Indeed priority
        id: acquisition
        continue-on-error: true
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python scripts/acquisition_precision.py
      - name: Stamp acquisition outcome
        env:
          ACQUISITION_OUTCOME: ${{ steps.acquisition.outcome }}
        run: python scripts/stamp_refresh_outcome.py
      - name: Restore rolling screened candidate stock before Indeed matching
        run: python scripts/postprocess_feed.py --previous /tmp/previous-jobs.json
      - name: Discover exact Indeed viewjob URLs and match restored candidates
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python scripts/supplement_indeed_web_index.py --previous /tmp/previous-jobs.json
      - name: Validate Indeed discovery runtime and harden matches
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python scripts/stamp_provider_health.py
      - name: Enforce candidate integrity
        run: python scripts/apply_candidate_integrity_gate.py
      - name: Reuse existing LLM vetoes without new paid review calls
        run: python scripts/apply_llm_quality_gate.py
      - name: Enforce AI-tool policy
        run: python scripts/apply_ai_tool_policy_gate.py
      - name: Restamp final source counts after all quality gates
        run: python scripts/harden_indeed_index_matches.py
      - name: Validate publishable feed
        run: |
          python scripts/validate_feed_trusted.py
          python scripts/validate_remote_feed.py
          python scripts/validate_candidate_integrity.py
          python scripts/validate_indeed_discovery_runtime.py
      - name: Report Indeed result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('data/jobs.json').read_text(encoding='utf-8'))
          print('Indeed refresh result:', {
              'version': data.get('candidate_indeed_index_version'),
              'queries_attempted': data.get('candidate_indeed_index_request_run'),
              'queries_successful': data.get('candidate_indeed_index_successful_searches'),
              'index_hits': data.get('candidate_indeed_index_hits_run'),
              'exact_url_seeds': data.get('candidate_indeed_index_seed_count'),
              'promoted': data.get('candidate_indeed_index_promoted_run'),
              'final_indeed': data.get('candidate_final_indeed_apply_jobs'),
              'profile_coverage': f"{data.get('candidate_indeed_index_profile_coverage_count')}/{data.get('candidate_indeed_index_profile_count')}",
              'unseen_profiles': data.get('candidate_indeed_index_unseen_profiles'),
              'indeed_body_directly_accessed': data.get('candidate_indeed_page_body_directly_accessed'),
              'pool': data.get('candidate_pool_size'),
          })
          PY
      - name: Commit fresh feed
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "main moved during fast refresh; refusing to publish stale data."
            exit 1
          fi
          git add data/jobs.json
          if git diff --cached --quiet; then
            echo "Feed content did not change."
            exit 0
          fi
          git commit -m "chore: refresh Indeed-first job feed"
          git push origin HEAD:main
