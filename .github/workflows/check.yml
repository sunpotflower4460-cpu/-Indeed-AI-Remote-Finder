name: Check
on:
  pull_request:
  push:
    branches: ["main"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Python tests
        run: python -m unittest discover -s tests -q
      - name: Python syntax
        run: python -m compileall -q scripts
      - name: Validate current feed
        run: |
          python scripts/validate_feed_trusted.py
          python scripts/validate_remote_feed.py
          python scripts/validate_candidate_integrity.py
      - name: Validate manifest JSON
        run: python -m json.tool manifest.webmanifest > /dev/null
      - name: JavaScript syntax
        run: |
          node --check app.js
          node --check integrity.js
          node --check refill.js
          node --check continuity.js
          node --check sw.js
