name: Check
on:
  pull_request:
  push:
    branches: ["main"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python tests
        run: python -m unittest discover -s tests -q
      - name: Python syntax
        run: python -m py_compile scripts/fetch_jobs.py scripts/postprocess_feed.py scripts/llm_review.py scripts/validate_feed.py
      - name: Validate current feed
        run: python scripts/validate_feed.py
      - name: JavaScript syntax
        run: node --check app.js
