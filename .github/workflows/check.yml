name: Check
on:
  pull_request:
  push:
    branches: ["agent/**"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python syntax
        run: python -m py_compile scripts/fetch_jobs.py tests/test_scoring.py
      - name: Scoring guards
        run: python -m unittest discover -s tests -q
