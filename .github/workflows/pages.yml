name: Deploy Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Stage public site only
        run: |
          mkdir -p _site/data
          cp index.html app.js sw.js manifest.webmanifest icon.svg _site/
          cp icon-180.png icon-192.png icon-512.png _site/
          # Production app.js also includes the no-secret integrity, static-feed,
          # source-ID/action continuity, simplified Japanese UX, and source tabs.
          # None dispatches Actions or calls SerpApi/authenticated APIs in-browser.
          cat integrity.js refill.js continuity.js ux.js source-tabs.js >> _site/app.js
          cp data/jobs.json _site/data/jobs.json
      - uses: actions/upload-pages-artifact@v4
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
